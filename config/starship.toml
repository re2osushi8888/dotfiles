# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Replace the '❯' symbol in the prompt with '➜'
[character] # The name of the module we are configuring is 'character'
success_symbol = '[❯](bold green)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[nodejs]
disabled = true

# Show each language's file extension instead of its emoji (the version is still shown)
[bun]
symbol = 'js '

[cobol]
symbol = 'cob '

[crystal]
symbol = 'cr '

[dart]
symbol = 'dart '

[deno]
symbol = 'ts '

[elixir]
symbol = 'ex '

[elm]
symbol = 'elm '

[fennel]
symbol = 'fnl '

[fortran]
symbol = 'f90 '

[gleam]
symbol = 'gleam '

[golang]
symbol = 'go '

[java]
symbol = 'java '

[kotlin]
symbol = 'kt '

[lua]
symbol = 'lua '

[mojo]
symbol = 'mojo '

[nim]
symbol = 'nim '

[ocaml]
symbol = 'ml '

[perl]
symbol = 'pl '

[php]
symbol = 'php '

[python]
symbol = 'py '

[raku]
symbol = 'raku '

[red]
symbol = 'red '

[rlang]
symbol = 'R '

[ruby]
symbol = 'rb '

[rust]
symbol = 'rs '

[scala]
symbol = 'scala '

[swift]
symbol = 'swift '

[custom.git_user]
description = "git user.name"
require_repo = true
command = 'git config user.name || echo "[!] Unset Git User"'
when = 'git config user.name >/dev/null 2>&1'
format = 'as [$output]($style) '
style = 'bold cyan'

